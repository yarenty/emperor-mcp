[package]
name = "emperor-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Opinionated MCP server framework: stateless Streamable HTTP transport, output framing, credential forwarding, rmcp bootstrap"
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/emperor-mcp"
homepage = "https://github.com/yarenty/emperor-mcp"
documentation = "https://docs.rs/emperor-mcp"
readme = "README.md"
keywords = ["mcp", "mcp-server", "server", "framework", "llm"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "emperor_mcp"
path = "src/lib.rs"

[dependencies]
# Lightweight JSON-RPC transport (McpHandler path)
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"

# rmcp ServerHandler bootstrap + framing helpers
rmcp = { version = "3.8", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional: shared server CLI flags (feature `cli`)
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }

[features]
default = []
# `cli::ServeArgs`: shared --bind / --stdio / --allowed-host / --allowed-origin flags (clap derive).
cli = ["dep:clap"]
# `testkit`: tool-list conformance checks for servers' own integration tests.
testkit = []

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
